name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**", "release/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  android:
    name: Android app (Capacitor)
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          # The default list includes the retired "tools" package, which no longer exists.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - run: npm ci
      - name: Build web bundle and sync into android/
        run: npm run build:android
      - name: Assemble debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/kinfold-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kinfold-android-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/kinfold-debug.apk
          if-no-files-found: error

  legacy-backend:
    name: Legacy v1 API (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -ntp verify
